<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車輛交收與損壞申報系統 (Fleet & Equipment Check-in)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="truck" class="w-6 h-6 text-white"></i></div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">車輛交收與損壞申報系統</h1>
                    <p class="text-xs text-slate-400">Fleet Check-in & Incident Reporting System</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="switchTab('driver')" id="nav-driver-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white transition">司機申報端</button>
                <button onclick="switchTab('admin')" id="nav-admin-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">主管後台端</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">

        <!-- ==================== 司機申報端 (Driver View) ==================== -->
        <section id="view-driver" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="border-b border-slate-100 pb-4 mb-6">
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="clipboard-pen-line" class="w-5 h-5 text-blue-600"></i> 每日車輛交收與隨車工具申報表
                    </h2>
                    <p class="text-sm text-slate-500 mt-1">請確實填寫車況與隨車工具清單，如有損壞或缺失請詳細記錄。</p>
                </div>

                <form id="report-form" onsubmit="submitReport(event)" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">車牌號碼 (Plate)</label>
                            <input type="text" id="plate" required placeholder="例如：AB1234" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">司機姓名 (Driver)</label>
                            <input type="text" id="driver" required placeholder="請輸入全名" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">申報類型 (Type)</label>
                            <select id="report-type" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                                <option value="交收日常檢驗">日常交收檢驗</option>
                                <option value="碰撞/損壞申報">碰撞/損壞申報</option>
                                <option value="裝備缺失申報">裝備缺失申報</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                            <i data-lucide="wrench" class="w-4 h-4 text-blue-600"></i> 隨車工具與裝備狀態點檢
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="千斤頂" checked class="rounded text-blue-600"> 千斤頂</label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="滅火器" checked class="rounded text-blue-600"> 滅火器</label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="急救箱" checked class="rounded text-blue-600"> 急救箱</label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="三角反光牌" checked class="rounded text-blue-600"> 三角反光牌</label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="備用輪胎" checked class="rounded text-blue-600"> 備用輪胎</label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="胎壓計" checked class="rounded text-blue-600"> 胎壓計</label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="藍牙設備" checked class="rounded text-blue-600"> 車載藍牙</label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" name="tool" value="油卡" checked class="rounded text-blue-600"> 車隊油卡</label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">發現缺失的工具/裝備（如有）</label>
                            <input type="text" id="missing-tools" placeholder="例如：滅火器壓力不足" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">碰撞或損壞部位（如有）</label>
                            <input type="text" id="damage-items" placeholder="例如：前保險桿輕微刮傷" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">詳細說明與備註</label>
                        <textarea id="description" rows="3" placeholder="請詳細描述交收時的車況或任何異常狀況..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <div class="flex items-center justify-end pt-4 border-t border-slate-100">
                        <button type="submit" id="submit-btn" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-sm transition flex items-center gap-2">
                            <i data-lucide="send" class="w-4 h-4"></i> 確認並提交雲端
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ==================== 主管後台端 (Admin View) ==================== -->
        <section id="view-admin" class="space-y-6 hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-4 mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="shield-check" class="w-5 h-5 text-blue-600"></i> 主管審核與責任判定後台
                        </h2>
                        <p class="text-sm text-slate-500 mt-1">管理與審核所有司機提交的車輛交收及損壞報告。</p>
                    </div>
                    <button onclick="fetchReportsFromSupabase()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition flex items-center gap-1.5">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 重新整理雲端數據
                    </button>
                </div>

                <div class="flex items-center gap-2 mb-4 overflow-x-auto pb-2">
                    <button onclick="setFilter('all')" id="btn-filter-all" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 text-white shadow-sm whitespace-nowrap">全部記錄</button>
                    <button onclick="setFilter('pending')" id="btn-filter-pending" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 whitespace-nowrap">待審核</button>
                    <button onclick="setFilter('incident')" id="btn-filter-incident" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 whitespace-nowrap">碰撞/損壞</button>
                    <button onclick="setFilter('missing')" id="btn-filter-missing" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 whitespace-nowrap">物品缺失</button>
                </div>

                <div id="admin-report-list" class="space-y-3"></div>
            </div>
        </section>

    </main>

    <!-- ==================== 審核詳情與責任判定 Modal ==================== -->
    <div id="admin-detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5 text-blue-600"></i> 申報審核與責任判定
                </h3>
                <button onclick="closeAdminDetailModal()" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div id="print-area" class="space-y-4 text-sm">
                <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div><span class="text-xs text-slate-500 block">申報單號</span><span id="modal-report-id" class="font-mono font-bold text-slate-800">--</span></div>
                    <div><span class="text-xs text-slate-500 block">提交時間</span><span id="modal-timestamp" class="text-slate-800">--</span></div>
                    <div><span class="text-xs text-slate-500 block">車牌號碼</span><span id="modal-plate" class="font-mono font-bold text-slate-800">--</span></div>
                    <div><span class="text-xs text-slate-500 block">申報司機</span><span id="modal-driver" class="text-slate-800">--</span></div>
                </div>

                <div>
                    <span class="text-xs font-semibold uppercase text-slate-500 block mb-1">狀況描述與細節</span>
                    <div id="modal-description" class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-slate-700">--</div>
                </div>

                <div class="border-t border-slate-200 pt-4 space-y-4 no-print">
                    <h4 class="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-green-600"></i> 主管責任判定與審核結論
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">責任歸屬判定</label>
                            <select id="verdict-responsibility" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                <option value="正常無損 (Normal)">正常無損 (Normal)</option>
                                <option value="自然損耗 / 機械老化">自然損耗 / 機械老化</option>
                                <option value="司機疏忽 / 應負賠償責任">司機疏忽 / 應負賠償責任</option>
                                <option value="第三方責任 / 交通意外">第三方責任 / 交通意外</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">審核狀態</label>
                            <select id="verdict-status" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                <option value="approved">已審核通過 (Approved)</option>
                                <option value="rejected">需修正或退回 (Rejected)</option>
                                <option value="pending">維持待審核 (Pending)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">主管批註意見</label>
                        <textarea id="verdict-notes" rows="2" placeholder="輸入批註或處理指示..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-slate-100 no-print">
                <button onclick="printCurrentReport()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
                    <i data-lucide="printer" class="w-4 h-4"></i> 列印交收證明
                </button>
                <div class="flex items-center gap-2">
                    <button onclick="closeAdminDetailModal()" class="px-4 py-2 border border-slate-300 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-50 transition">取消</button>
                    <button onclick="saveAdminVerdict()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-sm transition flex items-center gap-1.5">
                        <i data-lucide="save" class="w-4 h-4"></i> 儲存審核裁決
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // ==================== 1. Supabase 設定 ====================
        const SUPABASE_URL = 'https://celngxlithsslybhmtkk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlbG5neGxpdGhzc2x5YmhtdGtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTU4MDksImV4cCI6MjEwMTk3MTgwOX0.r5eb-PA6ay_BDkBp7MSp9ITmi-quTDf5SOiaKv8FABY';
    
        let supabaseClient = null;
        try {
            if (window.supabase && SUPABASE_URL.includes('supabase.co') && !SUPABASE_URL.includes('你的真實專案代號')) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase 初始化失敗:", e);
        }

        let reportsDatabase = [];
        let currentFilter = 'all';
        let activeReportId = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchReportsFromSupabase();
        });

        function switchTab(tab) {
            const driverSec = document.getElementById('view-driver');
            const adminSec = document.getElementById('view-admin');
            const driverBtn = document.getElementById('nav-driver-btn');
            const adminBtn = document.getElementById('nav-admin-btn');

            if (tab === 'driver') {
                driverSec.classList.remove('hidden');
                adminSec.classList.add('hidden');
                driverBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white transition";
                adminBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            } else {
                driverSec.classList.add('hidden');
                adminSec.classList.remove('hidden');
                adminBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white transition";
                driverBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                renderReportList();
            }
        }

        async function submitReport(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 提交中...';
            lucide.createIcons();

            const plate = document.getElementById('plate').value.trim().toUpperCase();
            const driver = document.getElementById('driver').value.trim();
            const type = document.getElementById('report-type').value;
            const description = document.getElementById('description').value.trim();
            const missingTools = document.getElementById('missing-tools').value.trim();
            const damageItems = document.getElementById('damage-items').value.trim();

            const tools = Array.from(document.querySelectorAll('input[name="tool"]:checked')).map(el => el.value);
            const reportId = 'REP-' + Math.floor(1000 + Math.random() * 9000);
            const nowIso = new Date().toISOString();

            const newReport = {
                report_id: reportId,
                plate: plate,
                driver: driver,
                type: type,
                description: description || '無特別備註',
                tools_status: tools,
                missing_tools: missingTools || '無',
                damage_items: damageItems || '無',
                status: 'pending',
                created_at: nowIso,
                verdict: { responsibility: '未判定', status: 'pending', notes: '' }
            };

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient.from('vehicle_reports').insert([newReport]);
                    if (error) {
                        console.error("Supabase 寫入錯誤:", error.message);
                        alert("雲端寫入失敗: " + error.message);
                    }
                } catch (err) {
                    console.error("網路異常:", err.message);
                }
            } else {
                alert("警告：尚未正確設定 Supabase 金鑰，資料僅會暫存！");
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> 確認並提交雲端';
            lucide.createIcons();

            alert('申報提交成功！單號：' + reportId);
            document.getElementById('report-form').reset();
            switchTab('admin');
            fetchReportsFromSupabase();
        }

        async function fetchReportsFromSupabase() {
            if (!supabaseClient) {
                console.warn("尚未設定 Supabase 金鑰，無法從雲端載入數據。");
                renderReportList();
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('vehicle_reports')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                reportsDatabase = (data || []).map(row => ({
                    id: row.report_id || row.id,
                    plate: row.plate,
                    driver: row.driver,
                    type: row.type,
                    description: row.description,
                    tools_status: row.tools_status || [],
                    missing_tools: row.missing_tools,
                    damage_items: row.damage_items,
                    status: row.status || 'pending',
                    created_at: row.created_at || new Date().toISOString(),
                    verdict: row.verdict || { responsibility: '未判定', status: 'pending', notes: '' }
                }));
            } catch (err) {
                console.error("載入 Supabase 數據失敗:", err.message);
            }

            renderReportList();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'pending', 'incident', 'missing'].forEach(f => {
                const btn = document.getElementById(`btn-filter-${f}`);
                if (!btn) return;
                if (f === filter) {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 text-white shadow-sm whitespace-nowrap";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 whitespace-nowrap";
                }
            });
            renderReportList();
        }

        function renderReportList() {
            const container = document.getElementById('admin-report-list');
            if (!container) return;

            let filtered = reportsDatabase;
            if (currentFilter === 'pending') {
                filtered = reportsDatabase.filter(r => r.status === 'pending');
            } else if (currentFilter === 'incident') {
                filtered = reportsDatabase.filter(r => r.type && r.type.includes('損壞'));
            } else if (currentFilter === 'missing') {
                filtered = reportsDatabase.filter(r => r.missing_tools && r.missing_tools !== '無' && r.missing_tools.trim() !== '');
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-50 rounded-xl border border-dashed border-slate-300 text-slate-400">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm">目前沒有符合條件的申報紀錄</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isPending = item.status === 'pending';
                const dateStr = new Date(item.created_at).toLocaleString();
                return `
                    <div class="p-4 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:border-blue-300 transition">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-mono font-bold text-slate-900 text-sm">${item.id}</span>
                                <span class="px-2 py-0.5 text-[10px] font-semibold bg-slate-100 text-slate-700 rounded">${item.type}</span>
                                ${isPending ? '<span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> 待審核</span>' : '<span class="text-[10px] bg-green-100 text-green-800 font-bold px-2 py-0.5 rounded-full">已審核</span>'}
                            </div>
                            <div class="text-xs text-slate-600 flex items-center gap-3">
                                <span>車牌: <strong class="font-mono text-slate-800">${item.plate}</strong></span>
                                <span>司機: <strong>${item.driver}</strong></span>
                                <span class="text-slate-400">${dateStr}</span>
                            </div>
                        </div>
                        <button onclick="openAdminDetailModal('${item.id}')" class="px-4 py-2 bg-slate-900 hover:bg-blue-600 text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
                            <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i> 審核並判定責任
                        </button>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

    function openAdminDetailModal(id) {
            const item = reportsDatabase.find(r => r.id === id);
            if (!item) return;

            activeReportId = id;
            document.getElementById('modal-report-id').textContent = item.id;
            document.getElementById('modal-timestamp').textContent = new Date(item.created_at).toLocaleString();
            document.getElementById('modal-plate').textContent = item.plate;
            document.getElementById('modal-driver').textContent = item.driver;
            document.getElementById('modal-description').textContent = item.description;

            if (item.verdict) {
                document.getElementById('verdict-responsibility').value = item.verdict.responsibility || '正常無損 (Normal)';
                document.getElementById('verdict-status').value = item.verdict.status || 'approved';
                document.getElementById('verdict-notes').value = item.verdict.notes || '';
            }

            document.getElementById('admin-detail-modal').classList.remove('hidden');
        }

        function closeAdminDetailModal() {
            document.getElementById('admin-detail-modal').classList.add('hidden');
            activeReportId = null;
        }

        async function saveAdminVerdict() {
            if (!activeReportId) return;

            const responsibility = document.getElementById('verdict-responsibility').value;
            const status = document.getElementById('verdict-status').value;
            const notes = document.getElementById('verdict-notes').value.trim();

            const updatedVerdict = { responsibility, status, notes };

            const index = reportsDatabase.findIndex(r => r.id === activeReportId);
            if (index !== -1) {
                reportsDatabase[index].status = status;
                reportsDatabase[index].verdict = updatedVerdict;
            }

            if (supabaseClient) {
                try {
                    await supabaseClient
                        .from('vehicle_reports')
                        .update({ status: status, verdict: updatedVerdict })
                        .eq('report_id', activeReportId);
                } catch (err) {
                    console.error("更新雲端失敗:", err);
                }
            }

            alert('審核與責任判定已成功儲存！');
            closeAdminDetailModal();
            renderReportList();
        }

        function printCurrentReport() {
            window.print();
        }
    </script>
</body>
</html>
